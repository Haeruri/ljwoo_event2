<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>한별이한테 보내는 이벤트2</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px;
  overflow:hidden;
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  background:
    linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),
    url("01.jpg") center/cover no-repeat;
  transition:background .8s ease;
}

.card{
  width:100%;
  max-width:420px;
  background:rgba(255,255,255,.95);
  border-radius:20px;
  padding:32px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
  z-index:10;
}

h1{font-size:20px;margin-bottom:24px}

.btn-container{
  position:relative;
  width:280px;
  height:90px;
  margin:0 auto;
}

.btn{
  position:absolute;
  width:120px;height:48px;
  border:none;border-radius:30px;
  font-size:16px;
  cursor:pointer;
  transition:.15s;
}
.btn:active{transform:scale(.95)}

.yes{left:0;background:#ff4d6d;color:#fff}
.no{left:160px;background:#ddd;color:#111}

.result{
  margin-top:18px;
  font-size:20px;
  font-weight:700;
  color:#ff4d6d;
  display:none;
}

.heart{
  position:fixed;
  pointer-events:none;
  animation:float 3s linear forwards;
}
@keyframes float{
  from{transform:translateY(0);opacity:1}
  to{transform:translateY(-400px);opacity:0}
}

#canvas{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
  z-index:5;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="card">
  <h1>나랑 평생 함께 할래? 💕</h1>

  <div class="btn-container" id="btnArea">
    <button class="btn yes" id="yesBtn">Yes</button>
    <button class="btn no" id="noBtn">No</button>
  </div>

  <div class="result" id="result">❤️ 선택해줘서 고마워 ❤️</div>
</div>

<script>
(() => {

/* =========================
   🎵 Web Audio 배경음악 (절대 안막힘)
========================= */
let audioCtx;
let isPlaying=false;

function startMusic(){
  if(isPlaying) return;

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const gainNode = audioCtx.createGain();
  gainNode.gain.value = 0.2;
  gainNode.connect(audioCtx.destination);

  function playNote(freq,time){
    const osc = audioCtx.createOscillator();
    osc.type="sine";
    osc.frequency.value=freq;
    osc.connect(gainNode);
    osc.start(audioCtx.currentTime+time);
    osc.stop(audioCtx.currentTime+time+0.4);
  }

  // 반복되는 간단한 로맨틱 멜로디
  setInterval(()=>{
    playNote(523.25,0);   // C
    playNote(659.25,0.3); // E
    playNote(783.99,0.6); // G
    playNote(659.25,0.9);
  },1200);

  isPlaying=true;
}

/* =========================
   ❤️ 하트
========================= */
function createHearts(){
  for(let i=0;i<30;i++){
    const h=document.createElement("div");
    h.className="heart";
    h.textContent="❤️";
    h.style.left=Math.random()*window.innerWidth+"px";
    h.style.top=window.innerHeight+"px";
    h.style.fontSize=(Math.random()*20+16)+"px";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),3000);
  }
}

/* =========================
   🎆 폭죽
========================= */
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
let fireworks=[];
let particles=[];
resize();
window.addEventListener("resize",resize);

function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}

class Firework{
  constructor(){
    this.x=Math.random()*canvas.width;
    this.y=canvas.height;
    this.targetY=Math.random()*canvas.height/2;
    this.speed=5;
    this.exploded=false;
  }
  update(){
    this.y-=this.speed;
    if(this.y<=this.targetY&&!this.exploded){
      this.exploded=true;
      explode(this.x,this.y);
    }
  }
  draw(){
    ctx.fillStyle="#fff";
    ctx.fillRect(this.x,this.y,2,10);
  }
}

function explode(x,y){
  for(let i=0;i<100;i++){
    particles.push({
      x,y,
      angle:Math.random()*Math.PI*2,
      speed:Math.random()*5+2,
      alpha:1,
      gravity:0.05,
      color:`hsl(${Math.random()*360},100%,60%)`
    });
  }
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  fireworks.forEach((f,i)=>{
    f.update();
    f.draw();
    if(f.exploded) fireworks.splice(i,1);
  });

  particles.forEach((p,i)=>{
    p.x+=Math.cos(p.angle)*p.speed;
    p.y+=Math.sin(p.angle)*p.speed;
    p.speed*=0.98;
    p.y+=p.gravity;
    p.alpha-=0.015;

    ctx.globalAlpha=p.alpha;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,3,0,Math.PI*2);
    ctx.fill();

    if(p.alpha<=0) particles.splice(i,1);
  });

  ctx.globalAlpha=1;
  requestAnimationFrame(animate);
}
animate();

function launchFireworks(){
  for(let i=0;i<5;i++){
    setTimeout(()=>fireworks.push(new Firework()),i*500);
  }
}

/* =========================
   버튼 이벤트
========================= */
const yesBtn=document.getElementById("yesBtn");
const noBtn=document.getElementById("noBtn");
const btnArea=document.getElementById("btnArea");
const result=document.getElementById("result");

yesBtn.addEventListener("click",()=>{
  startMusic(); // ✅ 클릭 기반 재생
  document.body.style.background=
    'linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),url("02.jpg") center/cover no-repeat';
  result.style.display="block";
  createHearts();
  launchFireworks();
});

function moveNo(){
  const w=noBtn.offsetWidth;
  const h=noBtn.offsetHeight;
  const maxX=btnArea.clientWidth-w;
  const maxY=btnArea.clientHeight-h;
  noBtn.style.left=Math.random()*maxX+"px";
  noBtn.style.top=Math.random()*maxY+"px";
}
noBtn.addEventListener("mouseenter",moveNo);
noBtn.addEventListener("touchstart",(e)=>{
  e.preventDefault();
  moveNo();
},{passive:false});
noBtn.addEventListener("click",(e)=>{
  e.preventDefault();
  moveNo();
});

})();
</script>

</body>
</html>
